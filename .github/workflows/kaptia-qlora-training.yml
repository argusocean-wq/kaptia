name: Kaptia QLoRA GPU training

on:
  workflow_dispatch:
    inputs:
      confirm_training:
        description: "Confirm starting QLoRA training on the configured self-hosted GPU runner"
        required: true
        type: boolean
        default: false
      epochs:
        description: "Training epochs"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "2"
      max_length:
        description: "Maximum token sequence length"
        required: true
        type: choice
        options:
          - "512"
          - "1024"
          - "2048"
        default: "1024"

permissions:
  contents: read

jobs:
  train:
    if: ${{ inputs.confirm_training }}
    # Requires a GPU runner that the repository owner has explicitly configured.
    # GitHub-hosted ubuntu-latest runners are not assumed to provide CUDA.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    env:
      KAPTIA_EPOCHS: ${{ inputs.epochs }}
      KAPTIA_MAX_LENGTH: ${{ inputs.max_length }}
      KAPTIA_RESUME_FROM_CHECKPOINT: auto
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Report GPU and validate datasets
        run: |
          python --version
          nvidia-smi
          python scripts/train_preflight.py
          python scripts/validate_training_data.py
          python scripts/validate_code_dataset.py
      - name: Install training dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Verify CUDA and bitsandbytes before training
        run: |
          python -c "import torch; print('torch', torch.__version__); print('cuda_available', torch.cuda.is_available()); assert torch.cuda.is_available(), 'CUDA GPU required'"
          python -c "import bitsandbytes, peft, transformers, datasets; print('training dependencies import successfully')"
      - name: Train or resume QLoRA adapter
        run: python scripts/train_qlora.py
      - name: Upload adapter, metrics, and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaptia-qlora-${{ github.run_id }}
          path: |
            outputs/kaptia-language-qlora/adapter/
            outputs/kaptia-language-qlora/metrics.json
            outputs/kaptia-language-qlora/checkpoint-*/
          if-no-files-found: warn
          retention-days: 14
