name: Kaptia base language pretraining

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/kaptia_scratch_model.py"
      - "scripts/kaptia_prepare_text_corpus.py"
      - "scripts/train_kaptia_scratch.py"
      - "scripts/chat.py"
      - "training/bootstrap_dialogue_seed.jsonl"
      - "training/engineering_review_corpus.jsonl"
      - "training/base_language_corpus.jsonl"
      - ".github/workflows/kaptia-scratch-pretraining.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaptia-scratch-pretraining
  cancel-in-progress: true

jobs:
  train-from-random-init:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip torch --index-url https://download.pytorch.org/whl/cpu
      - name: Restore previous Kaptia scratch checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: outputs/kaptia-scratch-pretrain
          key: kaptia-base-v2-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kaptia-base-v2-${{ github.ref_name }}-
      - name: Validate base-language corpus records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [Path('training/base_language_corpus.jsonl'), Path('training/engineering_review_corpus.jsonl')]
          total = 0
          for path in paths:
              count = 0
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  assert isinstance(row, dict) and isinstance(row.get('text'), str), f'{path}:{line_no}: expected text field'
                  assert len(row['text'].encode('utf-8')) >= 32, f'{path}:{line_no}: document too short'
                  count += 1
              assert count > 0, f'{path}: no records'
              total += count
              print(f'[PASS] {path}: {count} valid documents')
          assert total >= 80, f'Expected at least 80 curated documents; found {total}'
          print(f'[PASS] Total curated documents: {total}')
          PY
      - name: Prepare curated base-language corpus
        run: |
          mkdir -p training/base_language_input
          cp training/base_language_corpus.jsonl training/base_language_input/
          cp training/engineering_review_corpus.jsonl training/base_language_input/
          python scripts/kaptia_prepare_text_corpus.py --input training/base_language_input --output-dir training/scratch_corpus --val-fraction 0.08 --min-document-bytes 32
          cat training/scratch_corpus/metadata.json
      - name: Train base language model from random initialization
        shell: bash
        run: |
          if [ -f outputs/kaptia-scratch-pretrain/latest_checkpoint.pt ]; then
            readarray -t checkpoint_info < <(python - <<'PY'
          import hashlib
          import torch
          from pathlib import Path
          root = Path("outputs/kaptia-scratch-pretrain")
          checkpoint = torch.load(root / "latest_checkpoint.pt", map_location="cpu", weights_only=False)
          current = {
              "train_sha256": hashlib.sha256(Path("training/scratch_corpus/train.bin").read_bytes()).hexdigest(),
              "validation_sha256": hashlib.sha256(Path("training/scratch_corpus/val.bin").read_bytes()).hexdigest(),
          }
          same = checkpoint.get("corpus_fingerprint") == current
          print(int(checkpoint.get("step", 0)))
          print("same" if same else "changed")
          PY
            )
            current_step="${checkpoint_info[0]}"
            corpus_state="${checkpoint_info[1]}"
            if [ "$current_step" -ge 3000 ] && [ "$corpus_state" = "same" ]; then
              echo "Checkpoint already has 3000+ steps on this exact corpus; no redundant training."
            else
              if [ "$current_step" -ge 3000 ]; then
                additional_steps=1000
                echo "Corpus fingerprint changed. Continuing from step $current_step for $additional_steps additional steps."
              else
                additional_steps=$((3000 - current_step))
                echo "Resuming from step $current_step for $additional_steps steps to complete the base-model segment."
              fi
              python scripts/train_kaptia_scratch.py --data-dir training/scratch_corpus --output-dir outputs/kaptia-scratch-pretrain --steps "$additional_steps" --eval-interval 500 --eval-batches 4 --batch-size 4 --block-size 512 --layers 4 --heads 4 --width 128 --context-length 1024 --device cpu --resume outputs/kaptia-scratch-pretrain/latest_checkpoint.pt
            fi
          else
            echo "No checkpoint cache found; initializing all weights randomly and training for 3000 steps."
            python scripts/train_kaptia_scratch.py --data-dir training/scratch_corpus --output-dir outputs/kaptia-scratch-pretrain --steps 3000 --eval-interval 500 --eval-batches 4 --batch-size 4 --block-size 512 --layers 4 --heads 4 --width 128 --context-length 1024 --device cpu
          fi
      - name: Verify checkpoint provenance and training progress
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root = Path("outputs/kaptia-scratch-pretrain")
          checkpoint = torch.load(root / "latest_checkpoint.pt", map_location="cpu", weights_only=False)
          assert checkpoint.get("initialization") == "random"
          assert checkpoint.get("pretrained_source") is None
          assert int(checkpoint.get("step", 0)) >= 3000
          log = [json.loads(line) for line in (root / "training_log.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert log, "training log is empty"
          assert all("train" in row and "validation" in row for row in log)
          print(json.dumps({
              "status": "scratch_training_segment_verified",
              "step": checkpoint["step"],
              "initialization": checkpoint["initialization"],
              "pretrained_source": checkpoint["pretrained_source"],
              "metrics": checkpoint.get("metrics"),
              "log_records": len(log),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Verify the scratch checkpoint can produce a chat turn
        env:
          KAPTIA_SCRATCH_CHECKPOINT: outputs/kaptia-scratch-pretrain/best_checkpoint.pt
        run: |
          printf '你好。\n/exit\n' | python scripts/chat.py
      - name: Save checkpoint cache for the next training run
        uses: actions/cache/save@v4
        with:
          path: outputs/kaptia-scratch-pretrain
          key: kaptia-base-v2-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload checkpoint, manifest, logs, and corpus metadata
        uses: actions/upload-artifact@v4
        with:
          name: kaptia-base-language-${{ github.run_number }}
          path: |
            outputs/kaptia-scratch-pretrain/latest_checkpoint.pt
            outputs/kaptia-scratch-pretrain/best_checkpoint.pt
            outputs/kaptia-scratch-pretrain/manifest.json
            outputs/kaptia-scratch-pretrain/training_log.jsonl
            training/scratch_corpus/metadata.json
          if-no-files-found: error
          retention-days: 30
