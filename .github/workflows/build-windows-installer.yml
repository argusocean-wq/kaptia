name: Build and publish Kaptia Windows installer

on:
  push:
    branches: ["main"]
    paths:
      - "installer/**"
      - "scripts/**"
      - "vscode-extension/**"
      - "training/bootstrap_dialogue_seed.jsonl"
      - "requirements.txt"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaptia-windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Embed release build number
        shell: pwsh
        run: |
          @"
          BUILD_NUMBER = $env:GITHUB_RUN_NUMBER
          BUILD_TAG = "kaptia-build-$env:GITHUB_RUN_NUMBER"
          "@ | Set-Content -Path installer/build_info.py -Encoding utf8
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Kaptia-Setup installer/windows_installer.py
      - name: Generate installer SHA-256 checksum
        run: python -c "import hashlib,pathlib; p=pathlib.Path('dist/Kaptia-Setup.exe'); pathlib.Path('dist/Kaptia-Setup.exe.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  Kaptia-Setup.exe', encoding='ascii')"
      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kaptia-build-${{ github.run_number }}
          name: Kaptia Windows Installer ${{ github.run_number }}
          body: |
            Rolling Windows installer built from the current installer source.
            The installer prepares the local Python runtime and trains a small Kaptia scratch checkpoint from random initialization.
            If VS Code is installed, it also installs the '問問 Kaptia' right-click extension.
            The bootstrap checkpoint is experimental and not a general-capability language model.
          target_commitish: ${{ github.sha }}
          files: |
            dist/Kaptia-Setup.exe
            dist/Kaptia-Setup.exe.sha256
          overwrite_files: true
          make_latest: true
