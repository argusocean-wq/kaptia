name: Build Kaptia Windows installer

on:
  push:
    branches:
      - main
    paths:
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Kaptia-Setup installer/windows_installer.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaptia-Setup-Windows
          path: dist/Kaptia-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Kaptia-Setup.exe
          generate_release_notes: true
