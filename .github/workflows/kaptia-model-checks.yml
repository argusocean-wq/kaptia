name: Kaptia scratch model checks

on:
  push:
    paths:
      - "scripts/**"
      - "training/**"
      - "knowledge/**"
      - "docs/**"
      - "README.md"
      - "requirements.txt"
      - ".github/workflows/kaptia-model-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "training/**"
      - "knowledge/**"
      - "docs/**"
      - "README.md"
      - "requirements.txt"
      - ".github/workflows/kaptia-model-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-training-and-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch for scratch-model tests
        run: python -m pip install --upgrade pip torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Set up Node for VS Code extension validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate editor extension manifest and JavaScript
        run: |
          python -c "import json; json.load(open('vscode-extension/package.json', encoding='utf-8'))"
          node --check vscode-extension/extension.js
      - name: Test Kaptia tools, memory, and artifacts
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Smoke-test real scratch training on bundled text
        run: |
          python scripts/kaptia_prepare_text_corpus.py --input training/bootstrap_dialogue_seed.jsonl --output-dir /tmp/kaptia-scratch-corpus --val-fraction 0.10 --min-document-bytes 8
          python scripts/train_kaptia_scratch.py --data-dir /tmp/kaptia-scratch-corpus --output-dir /tmp/kaptia-scratch-smoke --steps 5 --eval-interval 5 --eval-batches 1 --batch-size 2 --block-size 16 --layers 1 --heads 2 --width 16 --context-length 32 --device cpu
      - name: Validate legacy JSONL structure (not used as pretrained model data)
        run: |
          python scripts/validate_training_data.py
          python scripts/validate_code_dataset.py
      - name: Test local knowledge retrieval
        run: python -m unittest scripts/test_knowledge_index.py
      - name: Build local knowledge pack
        run: python scripts/build_knowledge_index.py
      - name: Smoke-test source-attributed retrieval
        run: python scripts/query_knowledge.py "iPhone Safari 專案知識" --top-k 3
