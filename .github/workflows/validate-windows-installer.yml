name: Validate Windows installer PR

"on":
  push:
    branches:
      - premium-installer-ui
    paths:
      - installer/**
      - tests/**
      - .github/workflows/validate-windows-installer.yml
  pull_request:
    branches:
      - main
    paths:
      - installer/**
      - tests/**
      - .github/workflows/validate-windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, download regression tests, and Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile installer/windows_installer.py

      - name: Run download regression tests
        run: python -m unittest tests.test_installer_download -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable without publishing a release
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Kaptia-Setup installer/windows_installer.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Get-Item "dist/Kaptia-Setup.exe" -ErrorAction Stop
          if ($exe.Length -le 0) { throw "Installer executable is empty." }
          Write-Output "EXE bytes: $($exe.Length)"
